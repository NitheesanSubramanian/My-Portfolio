  <text x="400" y="186" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" text-anchor="middle">Δ</text>
  <text x="400" y="230" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">DRIFT-AWARE</text>
  <text x="400" y="250" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Evolution Engine</text>
