<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <g opacity="0.15">
    <path d="M 50,0 L 50,450 M 150,0 L 150,450 M 250,0 L 250,450 M 350,0 L 350,450 M 450,0 L 450,450 M 550,0 L 550,450 M 650,0 L 650,450 M 750,0 L 750,450" stroke="#38bdf8" stroke-width="1" />
    <path d="M 0,50 L 800,50 M 0,150 L 800,150 M 0,250 L 800,250 M 0,350 L 800,350" stroke="#38bdf8" stroke-width="1" />
  </g>
  <!-- Career Trajectory Paths -->
  <path d="M 120,320 C 220,280 280,340 380,240 S 520,180 680,120" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
  <path d="M 120,320 C 260,350 320,160 480,180 S 600,220 680,120" fill="none" stroke="url(#glow)" stroke-width="2" stroke-dasharray="6,6" />
  <!-- Nodes -->
  <circle cx="120" cy="320" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
  <circle cx="280" cy="340" r="7" fill="#8b5cf6" />
  <circle cx="380" cy="240" r="12" fill="#00d2ff" stroke="#ffffff" stroke-width="3" />
  <circle cx="520" cy="180" r="8" fill="#a855f7" />
  <circle cx="680" cy="120" r="14" fill="#3b82f6" stroke="#00d2ff" stroke-width="4" />
