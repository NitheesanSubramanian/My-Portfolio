  <rect x="340" y="80" width="180" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="430" y="103" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" text-anchor="middle" font-weight="600">AI CAREER MAPPER</text>
  <rect x="560" y="290" width="160" height="60" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.1)" />
  <text x="580" y="315" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Skill Matching Index</text>
  <text x="580" y="338" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">96.4% Fit</text>
