      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#shopBg)" />
  <!-- Left: Unstructured Raw Text Receipt -->
  <rect x="70" y="80" width="280" height="290" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2" />
  <rect x="70" y="80" width="280" height="40" rx="12" fill="#374151" />
  <text x="90" y="105" fill="#e5e7eb" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Raw Order Receipt Text</text>
  <text x="90" y="145" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Your Amazon.in order of</text>
  <text x="90" y="165" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">₹4,299 for Wireless Headset</text>
  <text x="90" y="185" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">is confirmed on 14 Nov 2026.</text>
  <text x="90" y="205" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Paid via UPI / HDFC Bank.</text>
  <text x="90" y="225" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Merchant: Cloudtail India</text>
  <!-- Center Arrow / AI Transformer -->
  <circle cx="400" cy="225" r="34" fill="#3b82f6" stroke="#60a5fa" stroke-width="3" />
