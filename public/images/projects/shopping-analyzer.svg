  <rect x="450" y="60" width="300" height="40" rx="12" fill="#14532d" />
  <text x="470" y="85" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Validated JSON Schema ✓</text>
  <text x="470" y="125" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">{</text>
  <text x="485" y="145" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"merchant": <tspan fill="#facc15">"Amazon.in"</tspan>,</text>
  <text x="485" y="165" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"amount": <tspan fill="#f43f5e">4299.00</tspan>,</text>
  <text x="485" y="185" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"currency": <tspan fill="#facc15">"INR"</tspan>,</text>
  <text x="485" y="205" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"category": <tspan fill="#facc15">"Electronics"</tspan>,</text>
  <text x="485" y="225" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"payment_method": <tspan fill="#facc15">"UPI"</tspan>,</text>
  <text x="485" y="245" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"date": <tspan fill="#facc15">"2026-11-14"</tspan>,</text>
  <text x="485" y="265" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">"status": <tspan fill="#22c55e">"CONFIRMED"</tspan></text>
  <text x="470" y="285" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">}</text>
  <rect x="470" y="315" width="260" height="28" rx="6" fill="#1e293b" />
  <text x="600" y="334" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Pydantic Model Checked 100%</text>
