<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dataBg)" />
  <!-- Stage 1 -->
  <rect x="50" y="150" width="140" height="150" rx="12" fill="#112240" stroke="#64ffda" stroke-width="1.5" />
  <text x="120" y="185" fill="#64ffda" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">STEP 01</text>
  <text x="120" y="215" fill="#e6f1ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Ingestion</text>
  <text x="120" y="240" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Missing Values</text>
  <text x="120" y="260" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Outlier Filtering</text>
  <!-- Connector 1 -->
  <line x1="190" y1="225" x2="230" y2="225" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Stage 2 -->
  <rect x="230" y="150" width="140" height="150" rx="12" fill="#112240" stroke="#00d2ff" stroke-width="1.5" />
  <text x="300" y="185" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">STEP 02</text>
  <text x="300" y="215" fill="#e6f1ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Imputation</text>
  <text x="300" y="240" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">KNN / Iterative</text>
  <text x="300" y="260" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Distribution Check</text>
  <!-- Connector 2 -->
  <line x1="370" y1="225" x2="410" y2="225" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Stage 3 -->
  <rect x="410" y="150" width="140" height="150" rx="12" fill="#112240" stroke="#a855f7" stroke-width="1.5" />
  <text x="480" y="185" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">STEP 03</text>
  <text x="480" y="215" fill="#e6f1ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Encoding</text>
  <text x="480" y="240" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">One-Hot / Label</text>
  <text x="480" y="260" fill="#8892b0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">StandardScaler</text>
  <!-- Connector 3 -->
  <line x1="550" y1="225" x2="590" y2="225" stroke="#a855f7" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Stage 4 -->
  <rect x="590" y="140" width="160" height="170" rx="12" fill="#1d2d50" stroke="#f43f5e" stroke-width="2" />
  <text x="670" y="175" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">FINAL PIPELINE</text>
  <text x="670" y="205" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Classification</text>
  <rect x="610" y="225" width="120" height="24" rx="6" fill="#be123c" />
  <text x="670" y="241" fill="#ffe4e6" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Scikit Pipeline</text>
  <text x="670" y="280" fill="#64ffda" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">ROC-AUC Evaluated</text>
</svg>
